# vim: ft=dosini
[Metadata]
Name=Pure White
Version=1.0
Author=Codex
Description=Pure white minimal theme with rounded corners
ScaleWithDPI=True

[InputPanel]
Font=Sans 13
Spacing=5

# Unselected candidate color
NormalColor=#333333
# Selected candidate color
HighlightCandidateColor=#ffffff
# Input character color
HighlightColor=#1a1a1a
# Input character background color
HighlightBackgroundColor=#ffffff

[InputPanel/TextMargin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/ContentMargin]
Left=7
Right=7
Top=5
Bottom=5

[InputPanel/Background]
Color=#ffffff
Image=panel.svg

[InputPanel/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/Highlight]
Color=#ffffff
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[Menu]
Font=Sans 10
NormalColor=#333333
Spacing=3

[Menu/Background]
Color=#ffffff

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#e8e8e8

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color=#e0e0e0

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
