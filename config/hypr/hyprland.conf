# Hyprland starter config (0.53) - generated by Codex
# Docs: https://wiki.hypr.land/Configuring/

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = Virtual-1, disable
monitor = HEADLESS-1, 1920x1080@60, 0x0, 1
monitor = , preferred, auto, 1

# Autostart
exec-once = __HOME__/.config/hypr/start-waybar.sh
exec-once = swaync
exec-once = dbus-update-activation-environment --systemd LANG LC_ALL LANGUAGE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = swaybg -m fill -i __HOME__/.config/hypr/current-wallpaper
exec-once = xfdesktop --disable-wm-check
exec-once = hypridle
exec-once = fcitx5 -d --disable notifications
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = __HOME__/.config/hypr/headless-remote.sh

# Programs
$terminal = kitty
$fileManager = thunar
$menu = __HOME__/.config/hypr/toggle-apps.sh

# Environment
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = LANG,zh_CN.UTF-8
env = LC_ALL,zh_CN.UTF-8
env = LANGUAGE,zh_CN:zh
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
    resize_on_border = true
    extend_border_grab_area = 14
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(00000000)
    }

    blur {
        enabled = true
        size = 18
        passes = 5
        vibrancy = 0.20
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 5, easeOutQuint
    animation = windowsOut, 1, 4, easeInOutCubic, popin 87%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Wofi app launcher and power menu are both normal windows, with different sizes.
windowrule {
    name = calendar-popup
    match:class = ^cn\.fengluoxiao\.CalendarPopup$

    float = yes
    center = yes
    rounding = 22
    border_size = 0
    no_shadow = yes
}

windowrule {
    name = wofi-launcher
    match:class = wofi
    match:title = 应用

    float = yes
    center = yes
    size = 860 620
    rounding = 18
    border_size = 0
    no_shadow = yes
}

windowrule {
    name = wofi-power-menu
    match:class = wofi
    match:title = 电源

    float = yes
    size = 220 210
    rounding = 18
    border_size = 0
    no_shadow = yes
    no_anim = yes
}

windowrule {
    name = auth-dialogs
    match:title = ^(Authentication required|Unlock Login Keyring|密码|认证).*

    float = yes
    center = yes
    rounding = 18
    border_size = 0
    no_shadow = yes
}

windowrule {
    name = keyring-dialogs
    match:class = ^(gcr-prompter|org\.gnome\.keyring|polkit-gnome-authentication-agent-1)$

    float = yes
    center = yes
    rounding = 18
    border_size = 0
    no_shadow = yes
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

$mainMod = SUPER

# Core bindings
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu --prompt '剪贴板> ' | cliphist decode | wl-copy
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = ALT, Return, fullscreen, 1
bind = $mainMod, SPACE, exec, __HOME__/.config/hypr/toggle-ime.sh
bind = CTRL, SPACE, exec, __HOME__/.config/hypr/toggle-ime.sh
bind = $mainMod, I, exec, fcitx5-configtool
bind = $mainMod, A, exec, nwg-look
bind = $mainMod, D, exec, __HOME__/.config/hypr/show-desktop.sh
bind = $mainMod SHIFT, D, exec, nwg-displays
bind = $mainMod, W, exec, __HOME__/.config/hypr/set-wallpaper.sh
bind = ALT, Tab, exec, __HOME__/.config/hypr/alt-tab.sh next
bind = ALT SHIFT, Tab, exec, __HOME__/.config/hypr/alt-tab.sh prev

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/resize floating windows from the keyboard
bind = ALT, left, moveactive, -40 0
bind = ALT, right, moveactive, 40 0
bind = ALT, up, moveactive, 0 -40
bind = ALT, down, moveactive, 0 40
bind = $mainMod SHIFT, left, resizeactive, -40 0
bind = $mainMod SHIFT, right, resizeactive, 40 0
bind = $mainMod SHIFT, up, resizeactive, 0 -40
bind = $mainMod SHIFT, down, resizeactive, 0 40

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse. Alt+Shift works better through Moonlight than Super.
bindm = ALT SHIFT, mouse:272, movewindow
bindm = ALT SHIFT, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = CTRL, Print, exec, grim __HOME__/图片/screenshot-$(date +%Y%m%d-%H%M%S).png

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
